name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Pins the mid-call decision guards and the realtime event names. Every
      # case in lib/callFlow.test.ts and lib/realtimeEvents.test.ts is a bug
      # that reached a live call, so a failure here is a regression, not a
      # stale test. Read the file headers before "simplifying" one away.
      - run: npm test

      - run: npm run build
